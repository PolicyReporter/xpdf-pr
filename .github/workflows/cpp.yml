name: C++ CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    # One native runner per architecture: packages are built with the target distro, never cross-compiled.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v6

    - name: Build .deb
      run: ARCHS=${{ matrix.arch }} scripts/build-deb.sh

    - uses: actions/upload-artifact@v6
      with:
        name: xpdf-pr-${{ matrix.arch }}
        path: dist/*.deb

  release:
    # Attaches both .deb files to new releases with v* tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v7
      with:
        path: artifacts
        merge-multiple: true
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/create-release.sh "${GITHUB_REF_NAME}" artifacts/*.deb
